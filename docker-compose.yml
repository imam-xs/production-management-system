#
# docker compose up -d
#
# Builds the backend, waits for MySQL and RabbitMQ, migrates and seeds, then
# starts the API, the consumer, and the React UI. The API and the worker share
# one image and differ only by APP_ROLE, so their code can never drift.
#
# The credentials below are development defaults, committed on purpose so the
# stack boots with no manual setup. They match backend/.env.example.
#
name: pms

# Set here rather than left to backend/.env, which is gitignored and may point
# somewhere else on a developer's machine. Dotenv never overwrites a variable
# that already exists, so these always win inside a container.
x-backend-env: &backend-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: production_management
  DB_USERNAME: pms_user
  DB_PASSWORD: pms_secret
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: pms_user
  RABBITMQ_PASSWORD: pms_secret
  QUEUE_CONNECTION: rabbitmq

services:

  mysql:
    image: mysql:8.0
    container_name: pms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: production_management
      MYSQL_USER: pms_user
      MYSQL_PASSWORD: pms_secret
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"   # avoids clashing with a local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [pms]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pms-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pms_user
      RABBITMQ_DEFAULT_PASS: pms_secret
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # console at http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [pms]

  app:
    build:
      context: ./backend
    image: pms-backend
    container_name: pms-app
    restart: unless-stopped
    environment:
      <<: *backend-env
      APP_ROLE: app
    ports:
      - "8001:80"       # API at http://localhost:8001
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s   # the first boot runs composer install
    networks: [pms]

  worker:
    build:
      context: ./backend
    image: pms-backend
    container_name: pms-worker
    restart: unless-stopped
    environment:
      <<: *backend-env
      APP_ROLE: worker
    command: ["php", "artisan", "queue:work", "rabbitmq", "--tries=3", "--max-time=3600"]
    volumes:
      - ./backend:/var/www/html
    depends_on:
      app:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 30s   # let the in-flight message finish
    networks: [pms]

  frontend:
    image: node:22-alpine
    container_name: pms-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8001/api/v1
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"     # admin UI at http://localhost:5173
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - app
    networks: [pms]

volumes:
  mysql_data:
  rabbitmq_data:
  frontend_node_modules:

networks:
  pms:
    driver: bridge
